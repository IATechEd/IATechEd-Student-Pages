<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>IATechEd Students</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link
            rel="stylesheet"
            type="text/css"
            href="static/documents/index.css"
        />

        <!-- Basic meta -->
        <meta
            name="description"
            content="Browse student portfolios from IATechEd."
        />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="{{ pageUrl }}" />
        <meta name="theme-color" content="#4a4b54" />

        <!-- Favicons -->
        <link
            rel="icon"
            type="image/svg+xml"
            sizes="any"
            href="static/images/favicon.svg"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="static/images/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="static/images/favicon-16x16.png"
        />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="IATechEd Students" />
        <meta property="og:url" content="{{ pageUrl }}" />
        <meta property="og:title" content="IATechEd Students" />
        <meta
            property="og:description"
            content="Browse student portfolios from IATechEd."
        />
        <meta property="og:image" content="{{ ogImageUrl }}" />
        <meta property="og:image:alt" content="IATechEd logo" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="IATechEd Students" />
        <meta
            name="twitter:description"
            content="Browse student portfolios from IATechEd."
        />
        <meta name="twitter:image" content="{{ ogImageUrl }}" />
        <meta name="twitter:image:alt" content="IATechEd logo" />

        <!-- Structured data: this page lists multiple people, so each student
             is represented as an ItemList of Person entries -->
        <script type="application/ld+json">
            {
            "@context": "https://schema.org",
            "@type": "ItemList",
            "itemListElement": [
                {% for student in students %}
                {
                    "@type": "ListItem",
                    "position": {{ loop.index }},
                    "item": {
                        "@type": "Person",
                        "name": {{ student.name | tojson }},
                        "url": {{ student.pageUrl | tojson }},
                        "image": {{ student.photoUrl | tojson }}
                    }
                }{% if not loop.last %},{% endif %}
                {% endfor %}
            ]
            }
        </script>
    </head>
    <body>
        <!-- ===================================================
             Page header
             =================================================== -->
        <div id="intro" class="containerDiv">
            <h1>IATechEd Students</h1>
            <p id="pField">Meet the students and browse their portfolios.</p>
        </div>

        <hr />

        <!-- ===================================================
             Student directory: one card per student, each card
             links out to that student's own page
             =================================================== -->
        <div id="studentsDiv">
            {% for student in students %}
            <a class="studentCard" href="{{ student.pageUrl }}">
                <img src="{{ student.photoUrl }}" alt="{{ student.name }}" />
                <h3>{{ student.name }}</h3>
                {% if student.field %}
                <p>{{ student.field }}</p>
                {% endif %}
            </a>
            {% else %}
            <p>No students to show yet.</p>
            {% endfor %}
        </div>
    </body>
</html>
